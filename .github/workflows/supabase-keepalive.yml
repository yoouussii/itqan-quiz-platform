# يمنع إيقاف مشروع Supabase المجاني تلقائياً بعد 7 أيام بلا استخدام (مثل الإجازات)
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 */3 * *' # كل 3 أيام
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # يقبل الرابط مع / أو /rest/v1 في آخره
          base=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#/+$##; s#/rest/v1$##')
          case "$base" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL يجب أن يكون بالشكل https://xxxx.supabase.co (من Project Settings ← Data API ← Project URL)"; exit 1 ;;
          esac
          code=$(curl -s -o body.txt -w '%{http_code}' \
            "$base/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          if [ "$code" -ge 400 ]; then head -c 300 body.txt; echo; exit 1; fi
