# تشغيل ملفات SQL على Supabase بزر واحد (بدلاً من نسخها في SQL Editor)
# Actions ← Supabase migrate ← Run workflow ← اختر الملف ← Run
#
# يتطلب سرّاً واحداً: SUPABASE_DB_URL
#   Supabase ← زر Connect ← Session pooler ← انسخ الرابط وضع كلمة مرور قاعدة البيانات مكان [YOUR-PASSWORD]
#   (رابط Session pooler وليس Direct connection، لأن خوادم GitHub لا تدعم IPv6)
#
# كل ملف يُنفَّذ في معاملة واحدة: إما ينجح كاملاً أو لا يتغير شيء.
name: Supabase migrate

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'الملف المطلوب تشغيله'
        required: true
        type: choice
        options:
          - supabase/migrations/002_users_columns.sql
          - supabase/migrations/003_security_all.sql
          - supabase/migrations/004_timer_answers_permissions.sql
          - supabase/migrations/005_notification_delete.sql
          - supabase/migrations/006_banners.sql
          - supabase/migrations/007_delete_submissions.sql
          - supabase/migrations/008_quiz_approval.sql
          - supabase/migrations/009_branches_parents.sql
          - supabase/migrations/010_unassigned_classes_visible.sql
          - supabase/migrations/011_shared_classes.sql
          - supabase/migrations/012_school_branding.sql
          - supabase/migrations/013_banner_options.sql
          - supabase/migrations/014_quiz_integrity.sql
          - supabase/migrations/015_question_bank.sql
          - supabase/migrations/016_question_pool.sql
          - supabase/migrations/017_push_notifications.sql
          - supabase/migrations/018_certificates.sql
          - supabase/migrations/019_maintenance_login_style.sql
          - supabase/migrations/020_login_identity.sql
          - supabase/migrations/021_student_home.sql
          - supabase/migrations/022_attendance.sql
          - supabase/migrations/023_restore_subjects.sql
          - supabase/migrations/024_attendance_roster.sql
          - supabase/migrations/025_attendance_roster_apply.sql
          - supabase/migrations/026_attendance_sheets.sql
          - supabase/migrations/027_attendance_sheet_labels.sql
          - supabase/migrations/028_attendance_controls.sql
          - supabase/migrations/029_attendance_alerts.sql
          - supabase/migrations/030_user_phone.sql
          - supabase/migrations/003_rollback.sql
      db_secret:
        description: 'اسم سر قاعدة البيانات (اتركه كما هو للمدرسة الأساسية، أو اكتب سر مدرسة أخرى مثل DB_URL_SCHOOL2)'
        required: false
        default: SUPABASE_DB_URL
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check connection
        env:
          DATABASE_URL: ${{ secrets[inputs.db_secret || 'SUPABASE_DB_URL'] }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::السر ${{ inputs.db_secret || 'SUPABASE_DB_URL' }} غير موجود"; exit 1; }
          psql "$DATABASE_URL" -tAc "select 'connected as ' || current_user"
      - name: Run ${{ inputs.file }}
        env:
          DATABASE_URL: ${{ secrets[inputs.db_secret || 'SUPABASE_DB_URL'] }}
        run: |
          # 002 فيه ALTER TYPE الذي لا يعمل داخل معاملة، فيُشغَّل بدونها (وهو آمن لإعادة التشغيل)
          if [ "${{ inputs.file }}" = "supabase/migrations/002_users_columns.sql" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "${{ inputs.file }}"
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -f "${{ inputs.file }}"
          fi
      - name: Verify
        if: inputs.file != 'supabase/migrations/002_users_columns.sql' && inputs.file != 'supabase/migrations/003_rollback.sql'
        env:
          DATABASE_URL: ${{ secrets[inputs.db_secret || 'SUPABASE_DB_URL'] }}
        run: |
          psql "$DATABASE_URL" -tA <<'SQL'
          select 'users with plaintext password: ' || count(*) filter (where password is not null) || ' / ' || count(*) from public.users;
          select 'hashed passwords: ' || count(*) from itqan.credentials;
          select 'policies: ' || count(*) from pg_policies where schemaname = 'public';
          select 'login function: ' || (to_regproc('public.itqan_login') is not null);
          select 'quiz timer function (004): ' || (to_regproc('public.itqan_start_quiz') is not null);
          select 'banners (006): ' || (to_regclass('public.banners') is not null);
          select 'branches & parents (009): ' || (to_regclass('public.branches') is not null);
          select 'attendance (022): ' || (to_regclass('public.attendance_records') is not null);
          select 'attendance roster (024): ' || (to_regclass('public.attendance_roster') is not null);
          select 'student home: daily challenge (021): ' || (to_regproc('public.itqan_daily_challenge') is not null);
          select 'maintenance mode (019): ' || (to_regproc('itqan.maintenance_on') is not null);
          select 'certificates registry (018): ' || (to_regclass('public.certificates') is not null);
          select 'push notifications (017): ' || (to_regclass('public.push_subscriptions') is not null);
          select 'question pool (016): ' || (to_regproc('public.itqan_served_questions') is not null);
          select 'question bank (015): ' || (to_regclass('public.question_bank') is not null);
          select 'quiz integrity (014): ' || (to_regproc('public.itqan_submit_quiz_v2') is not null);
          select 'banner options (013): ' || exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'banners' and column_name = 'effect');
          select 'school branding function (012): ' || (to_regproc('public.itqan_public_branding') is not null);
          select 'classes tied to a branch (0 after 011): ' || count(*) filter (where nullif(branch_id, '') is not null) from public.classes;
          select 'quiz approval enforced (008): ' || (to_regproc('itqan.approval_required') is not null);
          select 'delete submissions (007): ' || exists(select 1 from pg_policies where schemaname = 'public' and tablename = 'submissions' and policyname = 'submissions_delete');
          select 'notification delete (005): ' || exists(select 1 from information_schema.columns where table_schema = 'public' and table_name = 'notification_reads' and column_name = 'deleted_at');
          SQL
